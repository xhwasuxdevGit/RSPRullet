<html><head><meta charset="utf-8"><style>
/* 값은 style-spec.json 사본이다. spec을 바꾸면 여기도 함께 고친다 */
p,li,td{color:#334155}
/* 앞 간격은 padding-top으로 준다. margin-top은 변환에서 앞 요소와 겹쳐 0이 된다 */
p{font-size:12pt;line-height:150%;margin:0 0 12pt;padding-top:12pt}
p.lab{font-size:13pt;margin:0 0 13pt;padding-top:13pt}
p.cont{margin:0 0 12pt 32.4pt;padding-top:12pt}
p.sp{margin:0;padding:0}
ul,ol{margin-left:0;padding-left:0}
li{font-size:12pt;line-height:150%;margin:12pt 0 12pt 32.4pt}
ul ul>li,ol ul>li,ul ol>li,ol ol>li{margin-left:50.4pt}
ul ul ul>li,ol ul ul>li,ul ol ul>li,ul ul ol>li,ol ol ul>li,ol ul ol>li,ul ol ol>li,ol ol ol>li{margin-left:68.4pt}
li.toc{margin:0 0 0 32.4pt}
h1{font-size:19pt;color:#1E293B;line-height:115%;margin:0 0 19pt;padding-top:19pt;page-break-after:avoid}
h2{font-size:15pt;color:#334155;line-height:115%;margin:0 0 15pt;padding-top:15pt;page-break-after:avoid}
table{border-collapse:collapse}
td{font-size:11pt;padding:6pt 8pt;vertical-align:middle;background-color:#FFFFFF;border-top:1pt solid #F1F5F9;border-bottom:1pt solid #F1F5F9;border-left:1pt solid #F1F5F9;border-right:1pt solid #F1F5F9}
tr.h td{background-color:#F8FAFC;color:#1E293B;border-top:1pt solid #E2E8F0}
tr.z td{border-bottom:1pt solid #E2E8F0}
td.l{border-left:none}
td.r{border-right:none}
td>p{font-size:11pt;line-height:150%;margin:11pt 0 0 0;padding-top:0}
tr.h>td>p{line-height:100%;margin:0;color:#1E293B}
</style></head><body>

</body></html>
